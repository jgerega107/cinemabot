[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jellyfin-fluxer-bot"
version = "0.1.0"
description = "A shared Jellyfin cinema in Fluxer voice"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi", "uvicorn", "httpx", "websockets", "pydantic-settings", "av", "livekit", "numpy"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "ruff", "pyyaml"]

[project.scripts]
fluxer-cinema-probe = "cinema.probe:main"

[tool.setuptools.packages.find]
include = ["cinema*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]
