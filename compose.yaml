services:
  cinema:
    image: ${CINEMA_IMAGE:-ghcr.io/jgerega107/jellyfin-fluxer-bot:main}
    build: .
    restart: unless-stopped
    init: true
    env_file: ${CINEMA_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - jellyfin
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 4

networks:
  jellyfin:
    external: true
    name: ${JELLYFIN_NETWORK:-jellyfin}
