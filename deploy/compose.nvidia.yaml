# Requires the host NVIDIA driver and NVIDIA Container Toolkit configured for Docker.
# docker compose -f compose.yaml -f deploy/compose.nvidia.yaml up -d
services:
  cinema:
    environment:
      VIDEO_ENCODER: nvenc
      # compute loads CUDA; video loads NVENC; utility enables GPU monitoring.
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
