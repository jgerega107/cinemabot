apiVersion: v1
kind: ConfigMap
metadata:
  name: cinema
data:
  # Configure only the actual trusted ingress proxy addresses/CIDRs.
  TRUSTED_PROXY_CIDRS: ""
  PUBLIC_ORIGIN: https://cinema.example.com
  FLUXER_ORIGIN: https://chat.example.com
  FLUXER_GUILD_ID: "1234567890123456789"
  FLUXER_CHANNEL_IDS: ""
  # Comma-separated user IDs allowed to request/control; empty or unset allows everyone.
  FLUXER_REQUESTER_IDS: ""
  FLUXER_CLIENT_ID: replace-me
  JELLYFIN_URL: http://jellyfin.jellyfin.svc.cluster.local:8096
  JELLYFIN_FORCE_TRANSCODE: "false"
  JELLYFIN_USER_ID: "00000000000000000000000000000000"
  VIDEO_BITRATE: "6000000"
  VIDEO_ENCODER: auto
