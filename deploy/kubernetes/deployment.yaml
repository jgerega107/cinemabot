apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinema
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cinema
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cinema
    spec:
      # For the private GHCR image, create this registry Secret first.
      imagePullSecrets:
        - name: ghcr
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cinema
          image: ghcr.io/jgerega107/jellyfin-fluxer-bot:main
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cinema
            - secretRef:
                name: cinema
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "4"
              memory: 2Gi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
