name: Test and publish
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cinema-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check builder security baseline
        run: node -e 'const v=process.versions.node.split(".").map(Number); if(v[0]!==24 || v[1]<22 || (v[1]===22 && v[2]<1)) process.exit(1)'
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ruff check cinema tests scripts
      - run: python -m pytest -q
      - run: npm ci && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Validate deployment examples
        run: |
          CINEMA_ENV_FILE=.env.example docker compose --env-file .env.example config --quiet
          kubectl kustomize deploy/kubernetes > /tmp/cinema.yaml
          kubectl kustomize deploy/kubernetes-intel > /tmp/cinema-intel.yaml
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results
  image:
    needs: test
    runs-on: ubuntu-latest
    # Branch/tag runs must not race when first publishing the same commit.
    concurrency:
      group: cinema-image-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=main,enable={{is_default_branch}}
      - name: Check immutable commit image
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          if docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" > /tmp/manifest.txt 2> /tmp/manifest.err; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            # Authentication or registry outages must not trigger replacement.
            if [[ "$(cat /tmp/manifest.err)" != *"not found"* ]]; then
              cat /tmp/manifest.err
              exit 1
            fi
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        if: steps.commit.outputs.exists != 'true'
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cinema:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load existing commit image for verification
        if: steps.commit.outputs.exists == 'true'
        run: |
          docker pull --platform linux/amd64 "$IMAGE:sha-$GITHUB_SHA"
          docker tag "$IMAGE:sha-$GITHUB_SHA" cinema:test
      - name: Smoke test the exact image without upstream credentials
        run: |
          docker run -d --name cinema-smoke --network none --read-only --tmpfs /tmp:size=512m --env-file .env.example cinema:test
          for attempt in $(seq 1 20); do
            if docker exec cinema-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"; then break; fi
            sleep 1
          done
          docker exec cinema-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
          docker exec -i cinema-smoke python - <<'PY'
          import asyncio
          import os
          import av
          from livekit import rtc
          async def check():
              assert os.getuid() == 10001
              assert av.Codec('h264', 'r').is_decoder
              audio = rtc.AudioSource(48000, 2)
              video = rtc.VideoSource(320, 180)
              await audio.aclose()
              await video.aclose()
          asyncio.run(check())
          PY
          docker exec -i cinema-smoke python - < scripts/check_runtime.py
          printf '{"command":"close"}\n' | docker exec -i cinema-smoke python -m cinema.worker_entry
          docker rm -f cinema-smoke
      - uses: docker/build-push-action@v7
        if: github.event_name != 'pull_request' && steps.commit.outputs.exists != 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
      - name: Publish branch and release aliases
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [[ "$tag" != "$IMAGE:sha-$GITHUB_SHA" ]]; then
              docker buildx imagetools create --tag "$tag" "$IMAGE:sha-$GITHUB_SHA"
            fi
          done <<< "$TAGS"
