name: Test and publish
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cinema-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check builder security baseline
        run: node -e 'const v=process.versions.node.split(".").map(Number); if(v[0]!==24 || v[1]<22 || (v[1]===22 && v[2]<1)) process.exit(1)'
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ruff check cinema tests scripts
      - run: python -m pytest -q
      - run: npm ci && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Validate deployment examples
        run: |
          CINEMA_ENV_FILE=.env.example docker compose --env-file .env.example config --quiet
          kubectl kustomize deploy/kubernetes > /tmp/cinema.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results
  image:
    needs: test
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: container-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require release commits from the default branch
        if: github.event_name != 'pull_request'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set image names
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "CANDIDATE=$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}

      - name: Reuse an immutable commit image
        id: commit
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest}}' > "$RUNNER_TEMP/manifest.json" 2> "$RUNNER_TEMP/manifest.err"; then
            digest=$(jq -er '.digest' "$RUNNER_TEMP/manifest.json")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            if ! grep -qiE 'not found|manifest unknown' "$RUNNER_TEMP/manifest.err"; then
              cat "$RUNNER_TEMP/manifest.err"
              exit 1
            fi
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build once with SBOM and provenance
        id: build
        if: steps.commit.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && 'bot:test' || env.CANDIDATE }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max,version=v1' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load the exact published digest for checks
        id: image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.commit.outputs.digest || steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" bot:test
      - name: Smoke test the exact image without upstream credentials
        run: |
          docker run -d --name cinema-smoke --network none --read-only --tmpfs /tmp:size=512m --env-file .env.example bot:test
          for attempt in $(seq 1 20); do
            if docker exec cinema-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"; then break; fi
            sleep 1
          done
          docker exec cinema-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
          docker exec -i cinema-smoke python - <<'PY'
          import asyncio
          import os
          import av
          from livekit import rtc
          async def check():
              assert os.getuid() == 10001
              assert av.Codec('h264', 'r').is_decoder
              audio = rtc.AudioSource(48000, 2)
              video = rtc.VideoSource(320, 180)
              await audio.aclose()
              await video.aclose()
          asyncio.run(check())
          PY
          docker exec -i cinema-smoke python - < scripts/check_runtime.py
          printf '{"command":"close"}\n' | docker exec -i cinema-smoke python -m cinema.worker_entry
          docker rm -f cinema-smoke
      - name: Scan the tested image
        shell: bash
        run: |
          set -euo pipefail
          docker save bot:test -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP/image.tar:/image.tar:ro" \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --scanners vuln --format json --input /image.tar > "$RUNNER_TEMP/scan.json"
          jq -r '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | unique_by([.VulnerabilityID,.PkgName,.InstalledVersion]) | .[] | [.Severity,.VulnerabilityID,.PkgName,.InstalledVersion,.FixedVersion] | @tsv' "$RUNNER_TEMP/scan.json"
          jq -e '[.Results[]? | .Vulnerabilities[]? | select(.VulnerabilityID == "CVE-2026-111497" or .Severity == "CRITICAL")] | length == 0' "$RUNNER_TEMP/scan.json"
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign and verify the checked digest
        if: github.event_name != 'pull_request'
        timeout-minutes: 4
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s cosign sign --timeout 75s --yes "$IMAGE@$DIGEST" > "$RUNNER_TEMP/image-signing.json"
          timeout 90s cosign verify --timeout 75s "$IMAGE@$DIGEST" \
            --certificate-identity "$WORKFLOW_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > "$RUNNER_TEMP/image-verification.json"
          echo "Image signature verified for $IMAGE@$DIGEST"
      - name: Extract provenance and SBOM predicates
        if: github.event_name != 'pull_request'
        timeout-minutes: 4
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Provenance.SLSA}}' > "$RUNNER_TEMP/provenance.json"
          timeout 60s docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .SBOM.SPDX}}' > "$RUNNER_TEMP/sbom.json"
          jq -e '.buildDefinition.buildType and .runDetails.builder' "$RUNNER_TEMP/provenance.json" > /dev/null
          jq -e '.spdxVersion and .SPDXID' "$RUNNER_TEMP/sbom.json" > /dev/null
          echo "BuildKit SLSA v1 and SPDX predicates extracted"
      - name: Sign and verify provenance attestation
        if: github.event_name != 'pull_request'
        timeout-minutes: 4
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s cosign attest --timeout 75s --yes --type slsaprovenance1 --predicate "$RUNNER_TEMP/provenance.json" "$IMAGE@$DIGEST" > "$RUNNER_TEMP/provenance-signing.json"
          timeout 90s cosign verify-attestation --timeout 75s --type slsaprovenance1 "$IMAGE@$DIGEST" \
            --certificate-identity "$WORKFLOW_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > "$RUNNER_TEMP/provenance-verification.json"
          echo "provenance attestation verified for $IMAGE@$DIGEST"
      - name: Sign and verify SBOM attestation
        if: github.event_name != 'pull_request'
        timeout-minutes: 4
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s cosign attest --timeout 75s --yes --type spdxjson --predicate "$RUNNER_TEMP/sbom.json" "$IMAGE@$DIGEST" > "$RUNNER_TEMP/sbom-signing.json"
          timeout 90s cosign verify-attestation --timeout 75s --type spdxjson "$IMAGE@$DIGEST" \
            --certificate-identity "$WORKFLOW_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > "$RUNNER_TEMP/sbom-verification.json"
          echo "SBOM attestation verified for $IMAGE@$DIGEST"
      - name: Promote verified image to commit, branch and release tags
        timeout-minutes: 5
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.image.outputs.digest }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXISTING: ${{ steps.commit.outputs.exists }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            if [[ "$tag" == "$IMAGE:sha-$GITHUB_SHA" && "$EXISTING" == true ]]; then
              continue
            fi
            # Delayed runs must not roll moving aliases backward.
            if [[ "$tag" == "$IMAGE:latest" || "$tag" == "$IMAGE:$DEFAULT_BRANCH" || "$tag" == "$IMAGE:fluxer" ]]; then
              [[ "$current" == "$GITHUB_SHA" ]] || continue
            fi
            docker buildx imagetools create --tag "$tag" "$IMAGE@$DIGEST"
            actual=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -er '.digest')
            [[ "$actual" == "$DIGEST" ]]
          done <<< "$TAGS"
          echo "Published verified image: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
